<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diffusion Origami</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Diffusion">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" href="icone-192.png">
<style>
html, body { margin: 0; height: 100%; background: #1b1b1b; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
/* Écran de chargement de la coquille, dans le skin de l'appareil (retenu par l'appli), jusqu'à ce que l'appli prenne le relais. */
#charge { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: var(--fond, #f7f5f6); color: var(--texte, #1f1a1d); transition: opacity .3s; }
#charge.fini { opacity: 0; pointer-events: none; }
#charge .nom { font-size: 15px; letter-spacing: 4px; text-transform: uppercase; color: var(--doux, #6b6168); }
#charge .fil { width: 140px; height: 3px; border-radius: 3px; background: var(--ligne, #e6e0e3); overflow: hidden; }
#charge .fil::after { content: ""; display: block; width: 40%; height: 100%; background: var(--accent, #7d3c5e); animation: glisse 1.1s ease-in-out infinite; }
@keyframes glisse { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
#charge .retro { display: none; width: min(340px, 86vw); background: #c0c0c0; color: #000; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px #808080, inset 2px 2px #dfdfdf; padding: 3px; font: 13px/1.3 Tahoma, "MS Sans Serif", Geneva, sans-serif; }
#charge .retro b { display: block; background: linear-gradient(90deg, #000080, #1084d0); color: #fff; padding: 3px 6px; }
#charge .retro span { display: block; padding: 14px 12px 8px; }
#charge .retro i { display: block; margin: 0 12px 12px; height: 20px; background: #fff; box-shadow: inset 1px 1px #808080, inset -1px -1px #fff; overflow: hidden; }
#charge .retro i::after { content: ""; display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, #000080 0 12px, transparent 12px 15px); animation: blocs 2.4s steps(14) infinite; }
@keyframes blocs { to { width: 100%; } }
#charge.skin-retro { background: #008080; } #charge.skin-retro .retro { display: block; } #charge.skin-retro .nom, #charge.skin-retro .fil { display: none; }
#charge.skin-terminal .nom { font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0; text-transform: none; color: var(--accent, #3f3); }
@media (prefers-reduced-motion: reduce) { #charge .fil::after, #charge .retro i::after { animation: none; } }
/* Bandeau d'installation (seulement dans le navigateur, jamais dans l'appli installée) */
#installer { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 10; display: none;
  background: #ffffff; color: #1f1a1d; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.35); padding: 14px 14px 14px 16px; max-width: 520px; margin: 0 auto; }
#installer.ouvert { display: flex; gap: 12px; align-items: center; animation: monte .35s ease-out; }
@keyframes monte { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
#installer img { width: 48px; height: 48px; border-radius: 12px; flex: none; }
#installer .txt { flex: 1; min-width: 0; font-size: 14px; line-height: 1.35; }
#installer .txt b { display: block; font-size: 16px; margin-bottom: 2px; }
#installer .btn { flex: none; border: 0; border-radius: 12px; background: #7d3c5e; color: #fff; font: inherit; font-weight: 700; font-size: 15px; padding: 11px 16px; cursor: pointer; }
#installer .fermer { position: absolute; top: 4px; right: 8px; border: 0; background: none; font-size: 20px; color: #8a8086; cursor: pointer; padding: 4px; }
#installer .partage { display: inline-block; vertical-align: -3px; width: 16px; height: 16px; }
#installer a { color: #7d3c5e; font-weight: 600; }
</style>
</head>
<body>
<!-- credentialless : le cadre s'ouvre sans les comptes Google du téléphone (sinon un autre compte peut bloquer l'appli).
     Sa mémoire est effacée à chaque ouverture : la page garde donc le jeton de l'appareil et le repasse à l'appli. -->
<div id="charge" role="status" aria-live="polite"><div class="nom">Diffusion</div><div class="fil"></div><div class="retro" aria-hidden="true"><b>Diffusion</b><span>Chargement en cours…</span><i></i></div></div>
<iframe id="app" credentialless title="Diffusion Origami" allow="clipboard-read; clipboard-write; camera"></iframe>
<div id="installer" role="dialog" aria-label="Installer Diffusion Origami">
  <img src="icone-192.png" alt="">
  <div class="txt" id="instTexte"></div>
  <button class="btn" id="instBouton" hidden>Installer</button>
  <button class="fermer" id="instFermer" aria-label="Fermer">×</button>
</div>
<script>
(function () {
  var EXEC = "https://script.google.com/macros/s/AKfycbwbBlZSN1CCqGxq7vdJMerEC1khp3YUPK4LVz1OC-gFMsDRtHuwO00jDLmDzk2URziJwg/exec";
  var CLE = "diffusion_jeton";
  var FORME = /^[A-Za-z0-9_-]{32,200}$/;
  function lire(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
  function garder(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }
  var j = lire(CLE);
  // Apparence de l'appareil (skin, clair / sombre, couleurs) : retenue ici, car la mémoire du cadre est effacée à chaque ouverture.
  var AP = "diffusion_apparence", ap = null;
  try { ap = JSON.parse(lire(AP) || "null"); } catch (e) { ap = null; }
  var charge = document.getElementById("charge"), racine = document.documentElement;
  function peindre(a) {
    var sombreAppareil = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    var c = (a && a.couleurs) || (sombreAppareil ? { fond: "#17131a", texte: "#f1ebf3", doux: "#b1a5b6", ligne: "#3a3140", accent: "#d39ab9" } : { fond: "#f7f5f6", texte: "#1f1a1d", doux: "#6b6168", ligne: "#e6e0e3", accent: "#7d3c5e" });
    ["fond", "texte", "doux", "ligne", "accent"].forEach(function (k) { if (/^(#[0-9a-f]{3,8}|rgba?\([\d., ]+\))$/i.test(String(c[k] || "").trim())) racine.style.setProperty("--" + k, String(c[k]).trim()); });
    document.body.style.background = getComputedStyle(racine).getPropertyValue("--fond") || "";
    var skin = a && a.apparence && a.apparence.skin;
    charge.className = /^[a-z]+$/.test(skin || "") ? "skin-" + skin : "";
    var tc = document.querySelector('meta[name="theme-color"]'); if (tc && c.fond) tc.setAttribute("content", skin === "retro" ? "#000080" : c.fond);
  }
  peindre(ap);
  var param = ap && ap.apparence ? "&apparence=" + encodeURIComponent(JSON.stringify(ap.apparence)) : "";
  document.getElementById("app").src = EXEC + (FORME.test(j) ? "?jeton=" + encodeURIComponent(j) + param : (param ? "?" + param.slice(1) : ""));
  function base(ok) { try { var r = indexedDB.open("diffusion-coquille", 1); r.onupgradeneeded = function () { r.result.createObjectStore("c"); }; r.onsuccess = function () { ok(r.result); }; r.onerror = function () { ok(null); }; } catch (e) { ok(null); } }
  function lireCache(ok) { base(function (db) { if (!db) return ok(""); try { var q = db.transaction("c").objectStore("c").get(CLE + "_donnees"); q.onsuccess = function () { ok(q.result || ""); }; q.onerror = function () { ok(""); }; } catch (e) { ok(""); } }); }
  function ecrireCache(t) { base(function (db) { if (!db) return; try { var s = db.transaction("c", "readwrite").objectStore("c"); if (t) s.put(t, CLE + "_donnees"); else s.delete(CLE + "_donnees"); } catch (e) {} }); }
  // La copie des données ne se lit et ne s'écrit que depuis un cadre placé dans notre propre cadre app,
  // jamais depuis une autre page Google qui aurait ouvert cette page.
  function venantDeLAppli(w) { try { var cible = document.getElementById("app").contentWindow; for (var i = 0; w && i < 6; i++) { if (w === cible) return true; if (w === w.parent) return false; w = w.parent; } } catch (e) {} return false; }
  function finCharge() { charge.classList.add("fini"); setTimeout(function () { charge.style.display = "none"; }, 350); }
  document.getElementById("app").addEventListener("load", function () { setTimeout(finCharge, 8000); });
  window.addEventListener("message", function (ev) {
    if (!/^https:\/\/([a-z0-9-]+\.)*(script\.google\.com|googleusercontent\.com)$/.test(ev.origin)) return;
    var d = ev.data;
    // Dernières données de l'appli (ouverture immédiate) : gardées ici, la mémoire du cadre étant effacée à chaque ouverture.
    if (d && (d.diffusion === "cache-lire" || d.diffusion === "cache-ecrire") && !venantDeLAppli(ev.source)) return;
    if (d && d.diffusion === "cache-lire") { lireCache(function (t) { try { ev.source.postMessage({ diffusion: "cache", texte: t || "" }, ev.origin); } catch (e) {} }); return; }
    if (d && d.diffusion === "cache-ecrire") { ecrireCache(typeof d.texte === "string" ? d.texte : ""); return; }
    if (d && d.diffusion === "apparence" && d.apparence) {
      var garde = { apparence: d.apparence, theme: d.theme === "sombre" ? "sombre" : "clair", couleurs: d.couleurs || {} };
      garder(AP, JSON.stringify(garde)); peindre(garde); finCharge(); return;
    }
    if (!d || (d.origami !== "jeton" && d.diffusion !== "jeton")) return;
    garder(CLE, FORME.test(d.jeton || "") ? d.jeton : "");
  });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});

  // ---- Installation en un geste ----
  var installee = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
  var masque = parseInt(lire("diffusion_install_masque") || "0", 10) > Date.now();
  if (installee || masque) return;
  var boite = document.getElementById("installer"), texte = document.getElementById("instTexte"), bouton = document.getElementById("instBouton");
  var ua = navigator.userAgent || "";
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var safari = ios && /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA|FBAN|FBAV|Instagram|WhatsApp/.test(ua);
  var promesse = null;
  function montrer(html, avecBouton) { texte.innerHTML = html; bouton.hidden = !avecBouton; boite.classList.add("ouvert"); }
  document.getElementById("instFermer").onclick = function () { boite.classList.remove("ouvert"); garder("diffusion_install_masque", String(Date.now() + 14 * 864e5)); };
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); promesse = e;
    montrer("<b>Installer Diffusion Origami</b>L'appli de diffusion s'ouvrira en plein écran, comme une vraie application.", true);
  });
  bouton.onclick = function () {
    if (!promesse) return;
    promesse.prompt();
    promesse.userChoice.then(function (r) { if (r && r.outcome === "accepted") boite.classList.remove("ouvert"); promesse = null; });
  };
  window.addEventListener("appinstalled", function () { boite.classList.remove("ouvert"); });
  var partage = '<svg class="partage" viewBox="0 0 24 24" fill="none" stroke="#1f6fd1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v8h14v-8"/></svg>';
  setTimeout(function () {
    if (promesse) return;
    if (ios && safari) montrer("<b>Installer Diffusion Origami</b>Appuie sur " + partage + " <strong>Partager</strong>, puis « Sur l'écran d'accueil ».", false);
    else if (ios) montrer("<b>Installer Diffusion Origami</b>Ouvre ce lien dans <strong>Safari</strong> (menu ⋯ › « Ouvrir dans Safari ») pour l'ajouter à l'écran d'accueil.", false);
    else if (/Android/.test(ua) && /Chrome\//.test(ua) && !/; wv\)|SamsungBrowser|WhatsApp|FBAN|FBAV|Instagram/.test(ua)) montrer("<b>Installer Diffusion Origami</b>Menu ⋮ en haut à droite › « Installer l'application » ou « Ajouter à l'écran d'accueil ».", false);
    else if (/Android/.test(ua)) montrer("<b>Installer Diffusion Origami</b>Ouvre ce lien dans <strong>Chrome</strong>, puis menu ⋮ › « Ajouter à l'écran d'accueil ».", false);
    else montrer("<b>Installer Diffusion Origami</b>Dans Chrome ou Edge, clique sur l'icône d'installation à droite de la barre d'adresse.", false);
  }, 3500);
})();
</script>
</body>
</html>
