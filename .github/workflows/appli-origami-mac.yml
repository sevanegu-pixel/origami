# Fabrique l'appli Origami pour Mac (coquille Tauri du dossier appli-origami/) et la publie comme « version » GitHub à télécharger.
# La coquille ne contient aucune appli : elle affiche la page Origami en ligne (dossier accueil/).
name: Appli Origami Mac

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "appli-origami/**"
      - ".github/workflows/appli-origami-mac.yml"

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: appli-origami/src-tauri -> target

      - name: Outils
        working-directory: appli-origami
        run: npm install --no-audit --no-fund

      - name: Icônes
        working-directory: appli-origami
        run: npx tauri icon icone-1024.png

      - name: Fabrication (Mac Apple et Intel)
        working-directory: appli-origami
        run: npx tauri build --target universal-apple-darwin

      - name: Fichier à télécharger
        run: |
          f=$(ls appli-origami/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          cp "$f" "Origami-Mac.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Origami-Mac
          path: Origami-Mac.dmg

      - name: Version à télécharger
        uses: softprops/action-gh-release@v2
        with:
          tag_name: appli-origami-${{ github.run_number }}
          name: Appli Origami pour Mac (${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: Origami-Mac.dmg
          body: |
            Appli Origami pour Mac (essai) : les applis de la compagnie dans une seule fenêtre. Ouvrir le fichier .dmg, glisser « Origami » dans Applications.
            Première ouverture : l'appli n'est pas signée par Apple ; Réglages Système › Confidentialité et sécurité › « Ouvrir quand même ».
