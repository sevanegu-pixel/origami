# Fabrique les applis Origami pour Mac (coquille Tauri du dossier appli-origami/) et les publie comme « version » GitHub à télécharger.
# Une seule coquille pour quatre applis : Origami (l'appli mère), Compta, Tickets et Frais (chacune seule dans sa fenêtre).
# La coquille ne contient aucune appli : elle affiche la page Origami en ligne (dossier accueil/).
name: Applis Origami Mac

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "appli-origami/**"
      - ".github/workflows/appli-origami-mac.yml"

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        appli: [origami, compta, tickets, frais]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: appli-origami/src-tauri -> target

      - name: Outils
        working-directory: appli-origami
        run: npm install --no-audit --no-fund

      - name: Nom, identité, icône et adresse de cette appli
        id: appli
        working-directory: appli-origami
        run: node preparer.js ${{ matrix.appli }}

      - name: Icônes
        working-directory: appli-origami
        run: npx tauri icon icone-appli.png

      - name: Fabrication (Mac Apple et Intel)
        working-directory: appli-origami
        run: npx tauri build --target universal-apple-darwin

      - name: Fichier à télécharger
        run: |
          f=$(ls appli-origami/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          cp "$f" "${{ steps.appli.outputs.fichier }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.appli }}
          path: ${{ steps.appli.outputs.fichier }}

  publier:
    needs: mac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Version numérotée
        uses: softprops/action-gh-release@v2
        with:
          tag_name: appli-origami-${{ github.run_number }}
          name: Applis Origami pour Mac (${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: "*-Mac.dmg"
          body: |
            Applis Origami pour Mac (essai) : Origami (l'appli mère), Compta, Tickets et Frais, chacune dans son fichier. Ouvrir le fichier .dmg, glisser l'appli dans Applications.
            Première ouverture : l'appli n'est pas signée par Apple ; Réglages Système › Confidentialité et sécurité › « Ouvrir quand même ».

      # Adresse fixe pour les boutons « Télécharger pour Mac » de la page Origami : toujours les derniers fichiers.
      - name: Dernière version (adresse fixe)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: applis-mac
          name: Applis Origami pour Mac (dernière version)
          prerelease: true
          files: "*-Mac.dmg"
          body: |
            Les derniers fichiers d'installation des applis Origami pour Mac : Origami-Mac.dmg, Compta-Mac.dmg, Tickets-Mac.dmg, Frais-Mac.dmg.
            Première ouverture : l'appli n'est pas signée par Apple ; Réglages Système › Confidentialité et sécurité › « Ouvrir quand même ».
