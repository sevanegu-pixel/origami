# Fabrique l'appli Compta pour Android (fichier .apk) : une petite appli Android qui ouvre la même page que l'appli web
# installée sur le téléphone (sevanegu-pixel.github.io/origami/, Compta « accès PIN »). La Compta elle-même ne change pas.
# Publiée comme « version » GitHub : appli-compta-android-N, fichier Compta-Android.apk.
name: Appli Compta Android

on:
  workflow_dispatch:
  push:
    paths:
      - "appli-compta-android/**"
      - ".github/workflows/appli-compta-android.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Clé de signature : TOUJOURS la même (recalculée depuis le secret ANDROID_GRAINE, comme pour la Boîte mail),
      # sinon Android refuse d'installer une nouvelle version par-dessus l'ancienne. Sans le secret : clé d'essai jetable.
      - name: Signature
        working-directory: appli-compta-android
        env:
          ANDROID_GRAINE: ${{ secrets.ANDROID_GRAINE }}
        run: |
          if [ -n "$ANDROID_GRAINE" ]; then
            pip install --quiet cryptography
            MDP=$(python3 cle.py "$RUNNER_TEMP/compta.p12")
            ALIAS=boite
            echo "CLE_FIXE=oui" >> "$GITHUB_ENV"
          else
            MDP=$(openssl rand -hex 16)
            ALIAS=compta
            keytool -genkeypair -keystore "$RUNNER_TEMP/compta.p12" -storetype pkcs12 -alias compta -keyalg RSA -keysize 3072 -validity 18000 \
              -storepass "$MDP" -keypass "$MDP" -dname "CN=Compta, O=Origami, C=CH" > /dev/null
            echo "CLE_FIXE=non" >> "$GITHUB_ENV"
          fi
          printf 'keyAlias=%s\npassword=%s\nstoreFile=%s\n' "$ALIAS" "$MDP" "$RUNNER_TEMP/compta.p12" > keystore.properties

      - name: Fabrication
        working-directory: appli-compta-android
        env:
          NUMERO: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Fichier à télécharger
        run: |
          f=appli-compta-android/app/build/outputs/apk/release/app-release.apk
          test -f "$f" || { find appli-compta-android/app/build/outputs -name "*.apk"; exit 1; }
          cp "$f" Compta-Android.apk
          ls -l Compta-Android.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs Compta-Android.apk | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: Compta-Android
          path: Compta-Android.apk

      - name: Version à télécharger
        uses: softprops/action-gh-release@v2
        with:
          tag_name: appli-compta-android-${{ github.run_number }}
          name: Appli Compta pour Android (${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: Compta-Android.apk
          body: |
            Appli Compta pour téléphone Android. Ouvrir ce lien sur le téléphone, télécharger « Compta-Android.apk », l'ouvrir,
            puis autoriser une fois l'installation d'applis depuis le navigateur. Clé de signature fixe : ${{ env.CLE_FIXE }}.

  # Essai sur un téléphone virtuel (Android 14) : l'APK est installé et lancé, la Compta doit s'afficher (écran du code PIN) ;
  # le bouton retour ne doit pas fermer l'appli. Le journal et les captures sont joints à la version.
  essai:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Compta-Android

      - name: Accélération du téléphone virtuel
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Lancer l'appli
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r Compta-Android.apk
            adb logcat -c
            adb shell am start -n ch.origami.compta/.MainActivity
            sleep 45
            adb shell pidof ch.origami.compta && echo "APPLI EN VIE" || echo "APPLI ARRÊTÉE"
            adb exec-out screencap -p > essai-1-demarrage.png
            adb shell input keyevent 4
            sleep 3
            adb shell pidof ch.origami.compta && echo "APRÈS RETOUR : APPLI EN VIE (en arrière-plan)" || echo "APRÈS RETOUR : APPLI ARRÊTÉE"
            adb shell am start -n ch.origami.compta/.MainActivity
            sleep 5
            adb exec-out screencap -p > essai-2-rouverte.png
            adb logcat -d > journal.txt
            grep -E "AndroidRuntime|FATAL|chromium|compta" journal.txt | tail -80 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essai-telephone
          path: |
            journal.txt
            essai-*.png

      - name: Captures jointes à la version
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: appli-compta-android-${{ github.run_number }}
          files: |
            essai-1-demarrage.png
            essai-2-rouverte.png
