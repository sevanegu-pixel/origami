[package]
name = "origami-appli"
version = "0.4.2"
description = "Appli Origami (toutes les applis dans une fenêtre, installateur des applis, icône dans la barre des menus, connexion à Google par le navigateur)"
edition = "2021"

[lib]
name = "origami_appli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
plist = "1"
trash = "5"
