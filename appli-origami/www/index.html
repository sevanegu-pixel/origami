<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Origami</title>
<style>
html, body { margin: 0; height: 100%; background: #f3f1ed; color: #15131a; font: 14px/1.45 system-ui, -apple-system, sans-serif; }
main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 0 24px; text-align: center; }
.marque { font-size: 13px; font-weight: 700; letter-spacing: 0.2em; }
p { margin: 0; color: #67626e; }
button { font: inherit; min-height: 28px; padding: 0 12px; border: 1px solid #1f5cff; border-radius: 8px; background: #1f5cff; color: #ffffff; font-weight: 600; cursor: pointer; }
[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <div class="marque">ORIGAMI</div>
  <p id="texte" role="status">Ouverture…</p>
  <button id="encore" hidden>Réessayer</button>
</main>
<script>
(function () {
  // La coquille ne contient rien : elle ouvre la page Origami en ligne, la même que dans le navigateur.
  var ADRESSE = "https://sevanegu-pixel.github.io/origami/accueil/";
  var texte = document.getElementById("texte"), encore = document.getElementById("encore");
  function ouvrir() {
    texte.textContent = "Ouverture…"; encore.hidden = true;
    fetch(ADRESSE, { mode: "no-cors", cache: "no-store" }).then(function () { location.replace(ADRESSE); }).catch(function () {
      texte.textContent = "Pas de connexion à Internet pour l'instant."; encore.hidden = false;
    });
  }
  encore.onclick = ouvrir;
  ouvrir();
})();
</script>
</body>
</html>
