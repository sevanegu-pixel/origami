[package]
name = "tauri-plugin-boite-android"
version = "0.1.0"
description = "Boîte mail pour Android : veille des nouveaux mails en arrière-plan (WorkManager) et notifications."
edition = "2021"
links = "tauri-plugin-boite-android"

[dependencies]
tauri = { version = "2" }
serde = "1.0"
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
