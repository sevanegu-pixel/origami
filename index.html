<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Origami</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b1b1b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Origami">
<link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1ZgT5ZfV1S7viRnwUL5A1MfGUu2eNkmPl=s180">
<link rel="icon" href="https://lh3.googleusercontent.com/d/1ZgT5ZfV1S7viRnwUL5A1MfGUu2eNkmPl=s192">
<style>
html, body { margin: 0; height: 100%; background: #1b1b1b; overflow: hidden; }
iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!-- credentialless : le cadre s'ouvre sans les comptes Google du téléphone (sinon un autre compte peut bloquer l'appli).
     Sa mémoire est effacée à chaque ouverture : la page garde donc le jeton de l'appareil et le repasse à l'appli. -->
<iframe id="app" credentialless title="Origami" allow="clipboard-read; clipboard-write; camera"></iframe>
<script>
(function () {
  var EXEC = "https://script.google.com/macros/s/AKfycbwKllC_RGceJ1vjtyWwUhgaEo2Ub-sL7ShZbkgn8r4aMEZFp-K2z0Kfn9xEo5uOrBhx/exec";
  var CLE = "origami_jeton";
  function lire() { try { return localStorage.getItem(CLE) || ""; } catch (e) { return ""; } }
  function garder(j) { try { if (j) localStorage.setItem(CLE, j); else localStorage.removeItem(CLE); } catch (e) {} }
  var j = lire();
  document.getElementById("app").src = EXEC + (/^[a-f0-9]{96}$/.test(j) ? "?jeton=" + j : "");
  window.addEventListener("message", function (ev) {
    if (!/^https:\/\/([a-z0-9-]+\.)*(script\.google\.com|googleusercontent\.com)$/.test(ev.origin)) return;
    var d = ev.data;
    if (!d || d.origami !== "jeton") return;
    garder(/^[a-f0-9]{96}$/.test(d.jeton || "") ? d.jeton : "");
  });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
</body>
</html>
