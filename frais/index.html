<title>Frais</title>
<!-- L'appli Frais a déménagé à sa propre adresse (hors du dossier de la Compta) : cette page ne fait que rediriger, lien personnel compris. -->
<style>html,body{margin:0;background:#0e0e0e;color:#b9b0a8;font-family:system-ui,sans-serif}main{max-width:440px;margin:0 auto;padding:60px 20px;text-align:center;font-size:15px}a{color:#ffc04a}</style>
</head>
<body>
<main>Frais a changé d'adresse… <a id="lien" href="https://sevanegu-pixel.github.io/frais/">Ouvrir Frais</a></main>
<script>
(function () {
  var cible = "https://sevanegu-pixel.github.io/frais/" + (location.search || "");
  document.getElementById("lien").href = cible;
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (l) { l.forEach(function (r) { r.unregister(); }); }).catch(function () {});
  }
  location.replace(cible);
})();
</script>
</body>
</html>
