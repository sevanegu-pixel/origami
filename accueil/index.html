<meta name="theme-color" content="#f3f1ed">
<script>
// Fenêtre d'une seule appli : le fond de la page prend tout de suite la couleur de l'appli (le haut de la fenêtre du Mac et le bord de défilement la suivent).
(function () {
  var m = /[?&]fenetre=(compta|tickets)(&|$)/.exec(location.search);
  if (!m) return;
  var r = document.documentElement, t = document.querySelector('meta[name="theme-color"]');
  r.classList.add("sombre"); r.style.setProperty("--fond", m[1] === "compta" ? "#070707" : "#161616");
  if (t) t.content = m[1] === "compta" ? "#070707" : "#0d0d0d";
})();
</script>
<script>
// Taille de l'affichage choisie dans les Réglages : posée avant le premier dessin.
try { var t = parseInt(localStorage.getItem("origami_taille"), 10); if (t >= 70 && t <= 160) document.documentElement.style.setProperty("--taille", String(t / 100)); } catch (e) {}
</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Origami">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" href="icone-192.png">
<script>
// Tickets seul (?fenetre=tickets0) : appli à part sur le téléphone, avec son nom, son icône et sa propre fiche d'installation.
(function () {
  if (!/[?&]fenetre=tickets0(&|$)/.test(location.search)) return;
  var q = function (s) { return document.querySelector(s); };
  q('link[rel="manifest"]').href = "tickets0.webmanifest";
  q('meta[name="apple-mobile-web-app-title"]').content = "Tickets";
  q('link[rel="apple-touch-icon"]').href = "../tickets/icone-180.png";
  q('link[rel="icon"]').href = "../tickets/icone-192.png";
  document.title = "Tickets";
})();
</script>
<style>
:root { --fond: #f3f1ed; --carte: #ffffff; --carte2: #f8f7f4; --texte: #15131a; --doux: #67626e; --ligne: #e4e0e6; --accent: #1f5cff; --accent-clair: #dde7ff; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--fond); color: var(--texte); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, p { margin: 0; }

#origami { display: flex; height: 100%; }
/* Fenêtre d'une seule appli (appli Mac : une fenêtre par appli, ou l'appli installée seule) : ni volet ni barre. */
html.fenetre #menu, html.fenetre #barre { display: none !important; }
/* Pas de « color-scheme » ici : un cadre dont la page n'a pas le même réglage reçoit un fond blanc opaque (bande blanche au bord). */
html.sombre { --carte: #1d1d1d; --carte2: #232323; --texte: #ececec; --doux: #a9a9a9; --ligne: #353535; }

/* Menu de gauche */

.feuille { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 440px; max-height: 100%; overflow-y: auto; padding: 18px; border-radius: 14px; background: var(--carte); box-shadow: 0 12px 40px rgba(17, 16, 20, 0.25); }
.feuille h2 { font-size: 17px; }

.feuille p.souci { color: #b42318; }
.feuille .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; margin-top: 4px; }
#avis { position: fixed; left: 50%; bottom: 18px; z-index: 12; display: flex; flex-direction: column; align-items: center; gap: 6px; width: max-content; max-width: calc(100% - 28px); transform: translateX(-50%); pointer-events: none; }
#avis div { padding: 6px 14px; border-radius: 12px; background: var(--texte); color: var(--fond); font-size: 13px; text-align: center; }
#avis div.souci { background: #b42318; color: #ffffff; }
#nouvelle { position: fixed; right: 18px; bottom: 18px; z-index: 13; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; max-width: calc(100% - 28px); padding: 7px 8px 7px 14px; border: 1px solid var(--ligne); border-radius: 12px; background: var(--carte); box-shadow: 0 6px 24px rgba(21, 19, 26, 0.16); font-size: 13px; }

#menu, #barre, #scene > section, #voile, #avis, #nouvelle { zoom: var(--taille, 1); }

/* Tableau de bord */
.bord { display: flex; flex-direction: column; gap: 12px; max-width: 1080px; margin: 0 auto; }
.bord > .entete, .bord > .choix { max-width: none; width: 100%; margin: 0; }
.bord .entete { align-items: center; }
.jour { display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; border-radius: 16px; background: var(--carte); box-shadow: 0 1px 2px rgba(17, 16, 20, 0.06); }
.jour .phrase { font-size: 16px; line-height: 1.5; overflow-wrap: anywhere; }
.jour .phrase strong { font-weight: 650; }
.humeur { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 22px; padding: 0 10px; border-radius: 999px; background: var(--fond); color: var(--doux); font-size: 12px; font-weight: 600; }
.humeur::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #15803d; }
.humeur.moyen::before { background: #e0a800; }
.humeur.fort::before { background: #b42318; }
.tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; }
.tuile { display: flex; flex-direction: column; gap: 1px; min-width: 0; padding: 9px 12px; border: 1px solid transparent; border-radius: 12px; background: var(--carte2); text-align: left; }
button.tuile:hover { border-color: var(--ligne); }
.tuile strong { font-size: 21px; line-height: 1.2; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tuile span { color: var(--doux); font-size: 12px; }
.tuile.alerte strong { color: #b42318; }
.tuile.bien strong { color: #166534; }
/* Les montants sont plus longs que les nombres : un peu plus petits, pour ne jamais être coupés. */
.tuile.somme strong { font-size: 17px; line-height: 25px; }
.tuile.long strong { font-size: 15px; }
@media (max-width: 420px) { .tuiles { grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); } .tuile { padding: 8px 10px; } .tuile strong { font-size: 19px; } .tuile.somme strong { font-size: 16px; line-height: 23px; } .tuile.long strong { font-size: 14px; } }
@media (max-width: 350px) { .tuile.somme strong { font-size: 15px; } .tuile.long strong { font-size: 13px; } }
.blocs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr)); gap: 12px; align-items: start; }
.bloc { display: flex; flex-direction: column; min-width: 0; padding: 14px 16px 12px; border-radius: 14px; background: var(--carte); box-shadow: 0 1px 2px rgba(17, 16, 20, 0.06); }
.bloc .tete { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.bloc .tete svg { flex: none; width: 17px; height: 17px; fill: none; stroke: var(--doux); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.bloc h2 { flex: 1; min-width: 0; font-size: 15px; }
.bloc .tete .lien { text-decoration: none; }
.bloc .tete .lien:hover { text-decoration: underline; }
.bloc > p { color: var(--doux); font-size: 13px; }
.bloc .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.fil { display: flex; align-items: baseline; gap: 10px; width: 100%; padding: 7px 0; border: 0; border-top: 1px solid var(--ligne); background: none; text-align: left; font-size: 13px; }
.fil .quoi { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.fil .quoi small { display: block; color: var(--doux); font-size: 12.5px; font-weight: 400; }
.fil em { flex: none; color: var(--doux); font-size: 12px; font-style: normal; white-space: nowrap; }
.fil em.retard { color: #b42318; font-weight: 600; }
.fil em.bientot { color: #9a6700; font-weight: 600; }
.reste { padding-top: 6px; border-top: 1px solid var(--ligne); color: var(--doux); font-size: 12.5px; }
.jauges { display: flex; flex-direction: column; gap: 6px; }
.jauges > div { display: grid; grid-template-columns: minmax(0, 38%) 1fr 26px; align-items: center; gap: 8px; font-size: 12.5px; }
.jauges span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.jauge { height: 8px; border-radius: 999px; background: var(--fond); overflow: hidden; }
.jauge i { display: block; height: 100%; min-width: 3px; border-radius: 999px; background: var(--accent); }
.sommes { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-bottom: 4px; }
.sommes strong { display: block; font-size: 17px; line-height: 1.2; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sommes span { color: var(--doux); font-size: 12px; }
.fraicheur { color: var(--doux); font-size: 12.5px; }

/* Réglages */
.reglages { display: flex; flex-direction: column; gap: 10px; max-width: 1080px; margin: 0 auto; }
.reglages > * { max-width: none; width: 100%; margin-left: 0; margin-right: 0; }
.reglages > .entete { margin-bottom: 4px; }
.reglages > .sous-titre { margin: 12px 0 0; }
.reglages > .du-compte { margin: 6px 0 0; }
.reglages > .releve, .reglages > .choix { margin-top: 0; margin-bottom: 0; }
.reglage { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 14px; background: var(--carte); box-shadow: 0 1px 2px rgba(17, 16, 20, 0.06); }
.reglage h3 { font-size: 15px; }
.reglage > p { color: var(--doux); font-size: 13px; }
.reglage .rangs { display: flex; flex-direction: column; }
.rang-r { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 4px 0; border-top: 1px solid var(--ligne); font-size: 13px; }

.rang-r .nom { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.rang-r .nom small { display: block; color: var(--doux); font-size: 12.5px; }

#scene iframe.fond { display: block !important; visibility: hidden; pointer-events: none; }
#menu .pied { margin-top: auto; }

/* Téléphone : le menu devient une barre en bas */
#barre, .choix.tel { display: none; }
@media (max-width: 760px) {

  #avis { top: calc(10px + env(safe-area-inset-top)); bottom: auto; }
  #nouvelle { left: 14px; right: 14px; bottom: calc(66px + env(safe-area-inset-bottom)); }
  .champ input, .champ select, .champ textarea.simple, .filtres input, .filtres select, .devises input, .devise-bouton { font-size: 16px; }
  .choix.tel { display: flex; }
  #origami { flex-direction: column; }
  #menu { display: none; }
  #scene > section { padding: 16px 14px 28px; }
  #barre { flex: none; display: flex; gap: 2px; padding: 4px 6px calc(4px + env(safe-area-inset-bottom)); border-top: 1px solid var(--ligne); background: var(--carte); overflow-x: auto; }
  #barre button { flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 58px; padding: 4px 6px; border: 0; border-radius: 8px; background: none; color: var(--doux); font-size: 11px; }
  #barre button[aria-current="true"] { color: var(--accent); font-weight: 600; }
  #barre svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .entete h1 { font-size: 21px; }
}

/* Écran tactile (téléphone, tablette) : des cibles assez grandes pour le doigt, sans changer l'écran d'ordinateur. */
@media (pointer: coarse) {
  .puce { min-height: 34px; padding: 0 13px 0 10px; }
  .bouton { min-height: 36px; padding: 0 13px; }
  .petit { width: 34px; height: 34px; }
  .lien { padding: 9px 6px; margin: -9px -6px; }
  .inter { width: 46px; height: 28px; }
  .inter::after { top: 3px; left: 3px; width: 22px; height: 22px; }
  .inter[aria-checked="true"]::after { left: 21px; }
  .couleurs { gap: 10px; }
  .couleurs button { width: 32px; height: 32px; }
}

  function base(ok) { try { var q = indexedDB.open("origami-apercu", 1); q.onupgradeneeded = function () { q.result.createObjectStore("a"); }; q.onsuccess = function () { ok(q.result); }; q.onerror = function () { ok(null); }; } catch (e) { ok(null); } }
  function lire() {
    base(function (db) {
      if (!db) return;
      try {
        var s = db.transaction("a").objectStore("a"), qn = s.get("n");
        qn.onsuccess = function () {

          if (!n || n === vu) { db.close(); return; }
          var qd = s.get("document");

            var x = qd.result; db.close();
            if (!x || typeof x.html !== "string") return;
            vu = n; cadre.srcdoc = x.html; vide.style.display = "none";
            if (typeof x.titre === "string" && x.titre) document.title = x.titre.slice(0, 120);
          };
        };
        qn.onerror = function () { db.close(); };
      } catch (e) { try { db.close(); } catch (x) {} }

  setInterval(lire, 1500);
  setTimeout(function () { if (!vu) vide.textContent = "Pas de document à montrer. Ouvre un aperçu depuis la Compta."; }, 6000);
  lire();
})();

  // Retirer la compagnie : tout ce qui la relie à cet appareil est oublié, puis elle disparaît des comptes.
