<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="origami-version" content="2026-11-27.88">
<title>Origami</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f3f1ed">
<script>
// Fenêtre d'une seule appli : le fond de la page prend tout de suite la couleur de l'appli (le haut de la fenêtre du Mac et le bord de défilement la suivent).
(function () {
  var m = /[?&]fenetre=(compta|tickets)(&|$)/.exec(location.search);
  if (!m) return;
  var r = document.documentElement, t = document.querySelector('meta[name="theme-color"]');
  r.classList.add("sombre"); r.style.setProperty("--fond", m[1] === "compta" ? "#070707" : "#161616");
  if (t) t.content = m[1] === "compta" ? "#070707" : "#0d0d0d";
})();
</script>
<script>
// Taille de l'affichage choisie dans les Réglages : posée avant le premier dessin.
try { var t = parseInt(localStorage.getItem("origami_taille"), 10); if (t >= 70 && t <= 160) document.documentElement.style.setProperty("--taille", String(t / 100)); } catch (e) {}
</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Origami">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" href="icone-192.png">
<script>
// Tickets seul (?fenetre=tickets0) : appli à part sur le téléphone, avec son nom, son icône et sa propre fiche d'installation.
(function () {
  if (!/[?&]fenetre=tickets0(&|$)/.test(location.search)) return;
  var q = function (s) { return document.querySelector(s); };
  q('link[rel="manifest"]').href = "tickets0.webmanifest";
  q('meta[name="apple-mobile-web-app-title"]').content = "Tickets";
  q('link[rel="apple-touch-icon"]').href = "../tickets/icone-180.png";
  q('link[rel="icon"]').href = "../tickets/icone-192.png";
  document.title = "Tickets";
})();
</script>
<style>
:root { --fond: #f3f1ed; --carte: #ffffff; --carte2: #f8f7f4; --texte: #15131a; --doux: #67626e; --ligne: #e4e0e6; --accent: #1f5cff; --accent-clair: #dde7ff; }

html, body { margin: 0; height: 100%; background: var(--fond); color: var(--texte); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

.tk-choix { position: relative; }
.tk-choix summary { list-style: none; display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 10px; border-radius: 8px; cursor: pointer; font-weight: 600; max-width: calc(100vw - 40px); }

.tk-choix .liste { position: absolute; top: 40px; left: 0; min-width: 250px; max-width: calc(100vw - 24px); display: flex; flex-direction: column; gap: 1px; padding: 6px; border: 1px solid var(--ligne); border-radius: 12px; background: var(--carte); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18); }

/* Pas de « color-scheme » ici : un cadre dont la page n'a pas le même réglage reçoit un fond blanc opaque (bande blanche au bord). */

.progression { display: inline-flex; flex-direction: column; gap: 3px; min-width: 150px; font-size: 12px; color: var(--doux); }
.progression progress { width: 150px; height: 6px; appearance: none; -webkit-appearance: none; border: 0; border-radius: 3px; background: rgba(0, 0, 0, 0.1); overflow: hidden; }

/* Chargements animés (22.11) : une barre qui glisse, une roue qui tourne. Un écran qui travaille doit bouger. */
@keyframes glisse { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
@keyframes tourne { to { transform: rotate(360deg); } }
@keyframes pouls { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
.barre-vive { display: block; position: relative; width: 150px; max-width: 100%; height: 6px; border-radius: 3px; background: rgba(127, 127, 127, 0.25); overflow: hidden; }
.barre-vive i { position: absolute; left: 0; top: 0; bottom: 0; width: 40%; border-radius: 3px; background: #1f5cff; animation: glisse 1.4s ease-in-out infinite; }

p.progression .barre-vive { width: 220px; }
.roue { flex: none; display: inline-block; box-sizing: border-box; width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(31, 92, 255, 0.25); border-top-color: #1f5cff; animation: tourne 0.9s linear infinite; }

  .barre-vive i { width: 100%; animation: pouls 1.8s ease-in-out infinite; }

}

/* Scène : accueil, applis ouvertes, pages d'information */

.reglages { display: flex; flex-direction: column; gap: 10px; max-width: 1080px; margin: 0 auto; }
.reglages > * { max-width: none; width: 100%; margin-left: 0; margin-right: 0; }
.reglages > .entete { margin-bottom: 4px; }
.reglages > .sous-titre { margin: 12px 0 0; }
.reglages > .du-compte { margin: 6px 0 0; }
.reglages > .releve, .reglages > .choix { margin-top: 0; margin-bottom: 0; }
.reglage { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 14px; background: var(--carte); box-shadow: 0 1px 2px rgba(17, 16, 20, 0.06); }
.reglage h3 { font-size: 15px; }
.reglage > .actions { display: flex; flex-wrap: wrap; gap: 6px; }
.claude-neuf { margin: 10px 0; padding: 12px 14px; border-radius: 12px; background: rgba(31, 92, 255, 0.08); }
.claude-neuf .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.reglage > p { color: var(--doux); font-size: 13px; }
.reglage .rangs { display: flex; flex-direction: column; }
/* Visite de la Compta en images (appli Compta sans aucune Compta, 26.11) : plus large que la colonne de texte sur un grand écran. */
.visite-compta { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; width: min(880px, calc(100vw - 48px)); align-self: center; }
.visite-compta .onglets-visite { display: flex; flex-wrap: wrap; gap: 6px; }
.visite-compta .onglets-visite button { padding: 4px 11px; border: 1px solid var(--ligne); border-radius: 999px; background: var(--carte); color: var(--texte); font: inherit; font-size: 13px; cursor: pointer; }
.visite-compta .onglets-visite button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: #ffffff; }
.visite-compta .cadre-visite { position: relative; display: block; padding: 0; border: 1px solid var(--ligne); border-radius: 12px; overflow: hidden; background: #f3f1f2; cursor: zoom-in; aspect-ratio: 1440 / 900; }
.visite-compta .cadre-visite img { display: block; width: 100%; height: 100%; object-fit: cover; }
.visite-compta .cadre-visite .etiquette { position: absolute; left: 10px; bottom: 10px; padding: 3px 9px; border-radius: 999px; background: rgba(20, 16, 22, 0.82); color: #ffffff; font-size: 12px; }
.visite-compta .legende-visite { min-height: 2.9em; margin: 0; }
#visiteGrand { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 60; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; background: rgba(10, 8, 12, 0.88); }
#visiteGrand .zone { max-width: 100%; max-height: 100%; overflow: auto; border-radius: 10px; }
#visiteGrand img { display: block; max-width: min(1440px, calc(100vw - 150px)); max-height: calc(100vh - 70px); }
#visiteGrand button { flex: none; width: 38px; height: 38px; border: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.16); color: #ffffff; font-size: 18px; cursor: pointer; }
#visiteGrand button.fermer { position: absolute; top: 12px; right: 12px; }
#visiteGrand .pied { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; color: #ffffff; font-size: 13px; pointer-events: none; }
@media (max-width: 700px) {
  .visite-compta { width: 100%; }
  #visiteGrand { padding: 48px 0 34px; gap: 0; }
  #visiteGrand img { max-width: none; max-height: none; width: 900px; }
  #visiteGrand button.cote { position: absolute; bottom: 34px; z-index: 1; }
  #visiteGrand button.cote.avant { left: 10px; } #visiteGrand button.cote.apres { right: 10px; }
}
.rang-r { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 4px 0; border-top: 1px solid var(--ligne); font-size: 13px; }
.rang-r:first-child { border-top: 0; }
.rang-r .nom { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.rang-r .nom small { display: block; color: var(--doux); font-size: 12.5px; }
.petit { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; padding: 0; border: 1px solid var(--ligne); border-radius: 8px; background: var(--carte); font-size: 13px; }
.petit[disabled] { opacity: 0.35; cursor: default; }
.tailles { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tailles output { min-width: 48px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; }
#scene iframe.fond { display: block !important; visibility: hidden; pointer-events: none; }
#comptaSecours { position: absolute; top: 0; left: 0; right: 0; z-index: 6; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 8px 12px; background: var(--carte); color: var(--texte); border-bottom: 1px solid var(--ligne); box-shadow: 0 4px 14px rgba(0,0,0,.14); font-size: 13.5px; }
#comptaSecours p { margin: 0; flex: 1 1 260px; }
#comptaSecours .bouton, #comptaSecours select { padding: 5px 10px; font-size: 13px; min-height: 0; }
#comptaSecours select { border: 1px solid var(--ligne); border-radius: 8px; background: var(--fond); color: var(--texte); max-width: 190px; }
#menu .pied { margin-top: auto; }

/* Téléphone : le menu devient une barre en bas */
#barre, .choix.tel { display: none; }
@media (max-width: 760px) {
  #voile { align-items: flex-end; padding: 0; }
  .feuille { max-width: none; padding-bottom: calc(18px + env(safe-area-inset-bottom)); border-radius: 14px 14px 0 0; }
  #avis { top: calc(10px + env(safe-area-inset-top)); bottom: auto; }
  #nouvelle { left: 14px; right: 14px; bottom: calc(66px + env(safe-area-inset-bottom)); }
  .champ input, .champ select, .champ textarea.simple, .filtres input, .filtres select, .devises input, .devise-bouton { font-size: 16px; }
  .choix.tel { display: flex; }
  #origami { flex-direction: column; }
  #menu { display: none; }
  #scene > section { padding: 16px 14px 28px; }
  #barre { flex: none; display: flex; gap: 2px; padding: 4px 6px calc(4px + env(safe-area-inset-bottom)); border-top: 1px solid var(--ligne); background: var(--carte); overflow-x: auto; }
  #barre button { flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 58px; padding: 4px 6px; border: 0; border-radius: 8px; background: none; color: var(--doux); font-size: 11px; }
  #barre button[aria-current="true"] { color: var(--accent); font-weight: 600; }
  #barre svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .entete h1 { font-size: 21px; }
}

/* Écran tactile (téléphone, tablette) : des cibles assez grandes pour le doigt, sans changer l'écran d'ordinateur. */
@media (pointer: coarse) {
  .puce { min-height: 34px; padding: 0 13px 0 10px; }
  .bouton { min-height: 36px; padding: 0 13px; }
  .petit { width: 34px; height: 34px; }
  .lien { padding: 9px 6px; margin: -9px -6px; }
  .inter { width: 46px; height: 28px; }
  .inter::after { top: 3px; left: 3px; width: 22px; height: 22px; }
  .inter[aria-checked="true"]::after { left: 21px; }
  .couleurs { gap: 10px; }
  .couleurs button { width: 32px; height: 32px; }
}

(function () {

  document.documentElement.classList.add("fenetre");
  document.title = "Aperçu";
  document.body.innerHTML = '<iframe id="apercuCadre" sandbox="" title="Aperçu du document" style="position:fixed;top:0;left:0;width:100%;height:100%;border:0;background:#ffffff"></iframe><p id="apercuVide" role="status" style="position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;margin:0;padding:24px;text-align:center;color:#6b6570;font:15px system-ui,sans-serif">L\'aperçu arrive…</p>';

  function lire() {
    base(function (db) {
      if (!db) return;
      try {
        var s = db.transaction("a").objectStore("a"), qn = s.get("n");
        qn.onsuccess = function () {
          var n = Number(qn.result) || 0;
          if (!n || n === vu) { db.close(); return; }
          var qd = s.get("document");
          qd.onsuccess = function () {
            var x = qd.result; db.close();
            if (!x || typeof x.html !== "string") return;
            vu = n; cadre.srcdoc = x.html; vide.style.display = "none";
            if (typeof x.titre === "string" && x.titre) document.title = x.titre.slice(0, 120);
          };
        };
        qn.onerror = function () { db.close(); };
      } catch (e) { try { db.close(); } catch (x) {} }

  window.addEventListener("storage", function (ev) { if (ev.key === "origami_apercu_n") lire(); });
  setInterval(lire, 1500);
  setTimeout(function () { if (!vu) vide.textContent = "Pas de document à montrer. Ouvre un aperçu depuis la Compta."; }, 6000);
  lire();
})();
