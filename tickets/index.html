<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tickets</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d0d0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tickets">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" href="icone-192.png">
<style>
html, body { margin: 0; height: 100%; background: #161616; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
#charge { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #161616; color: #e8e8e8; transition: opacity .3s; }
#charge.fini { opacity: 0; pointer-events: none; }
#charge img { width: 84px; height: 84px; border-radius: 20px; }
#charge .fil { width: 140px; height: 3px; border-radius: 3px; background: #353535; overflow: hidden; }
#charge .fil::after { content: ""; display: block; width: 40%; height: 100%; background: #4ab0ff; animation: glisse 1.1s ease-in-out infinite; }
@keyframes glisse { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
@media (prefers-reduced-motion: reduce) { #charge .fil::after { animation: none; } }
/* Bandeau d'installation (seulement dans le navigateur, jamais dans l'appli installée) */
#installer { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 10; display: none;
  background: #ffffff; color: #1f1a1d; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.35); padding: 14px 14px 14px 16px; max-width: 520px; margin: 0 auto; }
#installer.ouvert { display: flex; gap: 12px; align-items: center; animation: monte .35s ease-out; }
@keyframes monte { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
#installer img { width: 48px; height: 48px; border-radius: 12px; flex: none; }
#installer .txt { flex: 1; min-width: 0; font-size: 14px; line-height: 1.35; padding-right: 14px; }
#installer .txt b { display: block; font-size: 16px; margin-bottom: 2px; }
#installer .btn { flex: none; border: 0; border-radius: 12px; background: #1f6fd1; color: #fff; font: inherit; font-weight: 700; font-size: 15px; padding: 11px 16px; cursor: pointer; }
#installer .fermer { position: absolute; top: 4px; right: 8px; border: 0; background: none; font-size: 20px; color: #8a8086; cursor: pointer; padding: 4px; }
#installer .partage { display: inline-block; vertical-align: -3px; width: 16px; height: 16px; }
</style>
</head>
<body>
<div id="charge" role="status" aria-live="polite"><img src="icone-192.png" alt=""><div class="fil"></div></div>
<iframe id="app" title="Tickets" allow="camera; clipboard-write"></iframe>
<div id="installer" role="dialog" aria-label="Installer Tickets">
  <img src="icone-192.png" alt="">
  <div class="txt" id="instTexte"></div>
  <button class="btn" id="instBouton" hidden>Installer</button>
  <button class="fermer" id="instFermer" aria-label="Fermer">×</button>
</div>
<script>
(function () {
  // Seule l'adresse publique de l'appli est ici (aucun code Apps Script). L'appli demande son code d'accès.
  var EXEC = "https://script.google.com/macros/s/AKfycbwfZp2gYNFsZxXvW3CZGf17PRRZ3WgC6IwpPPpO5iKiZUZmesmlbUMQJR2UF3jKYJ3C/exec";
  var CLE = "tickets_code";
  function lire(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
  function garder(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }
  var cadre = document.getElementById("app"), charge = document.getElementById("charge");
  // 28.11.2026 : une seule appli Tickets. Cette appli installée ouvre la nouvelle Tickets (avec le scanner), même adresse que la fenêtre Tickets du Mac.
  cadre.src = "../accueil/?fenetre=tickets";
  function finCharge() { charge.classList.add("fini"); setTimeout(function () { charge.style.display = "none"; }, 350); }
  cadre.addEventListener("load", function () { setTimeout(finCharge, 1500); });
  // Le code d'accès se lit et s'écrit seulement depuis notre propre cadre (l'appli Tickets dans ses cadres Google).
  function venantDeLAppli(w) { try { var cible = cadre.contentWindow; for (var i = 0; w && i < 6; i++) { if (w === cible) return true; if (w === w.parent) return false; w = w.parent; } } catch (e) {} return false; }
  window.addEventListener("message", function (ev) {
    if (!/^https:\/\/([a-z0-9-]+\.)*(script\.google\.com|googleusercontent\.com)$/.test(ev.origin)) return;
    var d = ev.data;
    if (!d || !venantDeLAppli(ev.source)) return;
    if (d.tickets === "code-lire") { try { ev.source.postMessage({ tickets: "code", code: lire(CLE) }, ev.origin); } catch (e) {} return; }
    if (d.tickets === "code-garder") { garder(CLE, typeof d.code === "string" && d.code.length <= 100 ? d.code : ""); finCharge(); }
  });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});

  // ---- Installation en un geste ----
  var installee = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
  var masque = parseInt(lire("tickets_install_masque") || "0", 10) > Date.now();
  if (installee || masque) return;
  var boite = document.getElementById("installer"), texte = document.getElementById("instTexte"), bouton = document.getElementById("instBouton");
  var ua = navigator.userAgent || "";
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var mac = /Macintosh/.test(ua) && !ios;
  var safari = /Safari/.test(ua) && !/Chrome|Chromium|CriOS|FxiOS|EdgiOS|OPiOS|GSA|FBAN|FBAV|Instagram|WhatsApp|Firefox/.test(ua);
  var promesse = null;
  function montrer(html, avecBouton) { texte.innerHTML = html; bouton.hidden = !avecBouton; boite.classList.add("ouvert"); }
  document.getElementById("instFermer").onclick = function () { boite.classList.remove("ouvert"); garder("tickets_install_masque", String(Date.now() + 14 * 864e5)); };
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); promesse = e;
    montrer("<b>Installer Tickets</b>L'appli s'ouvrira en plein écran, comme une vraie application.", true);
  });
  bouton.onclick = function () {
    if (!promesse) return;
    promesse.prompt();
    promesse.userChoice.then(function (r) { if (r && r.outcome === "accepted") boite.classList.remove("ouvert"); promesse = null; });
  };
  window.addEventListener("appinstalled", function () { boite.classList.remove("ouvert"); });
  var partage = '<svg class="partage" viewBox="0 0 24 24" fill="none" stroke="#1f6fd1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v8h14v-8"/></svg>';
  setTimeout(function () {
    if (promesse) return;
    if (ios && safari) montrer("<b>Installer Tickets</b>Appuie sur " + partage + " <strong>Partager</strong>, puis « Sur l'écran d'accueil ».", false);
    else if (ios) montrer("<b>Installer Tickets</b>Ouvre ce lien dans <strong>Safari</strong>, puis " + partage + " Partager › « Sur l'écran d'accueil ».", false);
    else if (mac && safari) montrer("<b>Installer Tickets</b>Menu <strong>Fichier</strong> › « Ajouter au Dock ».", false);
    else if (/Android/.test(ua) && /Chrome\//.test(ua) && !/; wv\)|SamsungBrowser|WhatsApp|FBAN|FBAV|Instagram/.test(ua)) montrer("<b>Installer Tickets</b>Menu ⋮ en haut à droite › « Installer l'application » ou « Ajouter à l'écran d'accueil ».", false);
    else if (/Android/.test(ua)) montrer("<b>Installer Tickets</b>Ouvre ce lien dans <strong>Chrome</strong>, puis menu ⋮ › « Ajouter à l'écran d'accueil ».", false);
    else montrer("<b>Installer Tickets</b>Dans Chrome ou Edge, clique sur l'icône d'installation à droite de la barre d'adresse.", false);
  }, 3500);
})();
</script>
</body>
</html>
