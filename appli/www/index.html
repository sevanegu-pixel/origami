<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diffusion</title>
<style>
  :root { --fond: #f6f3f4; --texte: #2a1d26; --doux: #7a6873; --accent: #7a3a63; }
  @media (prefers-color-scheme: dark) { :root { --fond: #1d1519; --texte: #f2eaef; --doux: #b3a2ad; --accent: #d79bc1; } }
  html, body { margin: 0; height: 100%; background: var(--fond); color: var(--texte); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .attente { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; box-sizing: border-box; text-align: center; }
  .attente b { font-size: 18px; letter-spacing: .2em; text-transform: uppercase; }
  .attente p { margin: 0; color: var(--doux); max-width: 420px; }
  .attente button { font: inherit; border: 0; border-radius: 999px; padding: 10px 18px; background: var(--accent); color: #fff; cursor: pointer; }
  .cache { display: none; }
</style>
</head>
<body>
<div class="attente">
  <b>Diffusion</b>
  <p id="etat">Ouverture…</p>
  <button type="button" id="reessayer" class="cache">Réessayer</button>
</div>
<script>
/*
 * Appli Diffusion pour Mac et Android : coquille locale.
 * Elle ne contient rien de Diffusion : l'écran vient du serveur (adresse PIN, « porte » doPost), il est gardé sur l'appareil
 * et s'affiche tout de suite aux ouvertures suivantes ; la nouvelle version éventuelle est préparée pour la fois d'après.
 * Les appels google.script.run de l'écran passent par la porte, avec le jeton d'appareil que l'écran garde lui-même.
 */
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbwbBlZSN1CCqGxq7vdJMerEC1khp3YUPK4LVz1OC-gFMsDRtHuwO00jDLmDzk2URziJwg/exec';
  var BASE = 'diffusion-appli', MAGASIN = 'ecran';
  window.__PORTE_DIFFUSION__ = EXEC;

  function base(ok) {
    try {
      var r = indexedDB.open(BASE, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore(MAGASIN); };
      r.onsuccess = function () { ok(r.result); };
      r.onerror = function () { ok(null); };
    } catch (e) { ok(null); }
  }
  function lire(cle, ok) {
    base(function (db) {
      if (!db) return ok(null);
      try { var q = db.transaction(MAGASIN).objectStore(MAGASIN).get(cle); q.onsuccess = function () { ok(q.result || null); }; q.onerror = function () { ok(null); }; } catch (e) { ok(null); }
    });
  }
  function ecrire(cle, v) {
    base(function (db) { if (db) try { db.transaction(MAGASIN, 'readwrite').objectStore(MAGASIN).put(v, cle); } catch (e) { /* gardé la prochaine fois */ } });
  }
  function porte(f, jeton, args) {
    return fetch(EXEC, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ f: f, jeton: jeton || '', args: args || [] }), redirect: 'follow' })
      .then(function (r) { if (!r.ok) throw new Error('Le serveur ne répond pas (' + r.status + ').'); return r.json(); })
      .then(function (x) { if (!x || !x.ok) throw new Error((x && x.erreur) || 'Réponse vide du serveur.'); return x.r; });
  }

  /* Ce qui remplace google.script.run et le reste de google.script dans l'écran. */
  var SHIM = '(' + function (EXEC) {
    function appel(f, jeton, args) {
      return fetch(EXEC, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ f: f, jeton: jeton || '', args: args || [] }), redirect: 'follow' })
        .then(function (r) { if (!r.ok) throw new Error('Le serveur ne répond pas (' + r.status + ').'); return r.json(); })
        .then(function (x) { if (!x || !x.ok) throw new Error((x && x.erreur) || 'Réponse vide du serveur.'); return x.r; });
    }
    function lanceur() {
      var ok = null, ko = null, objet = null;
      var p = new Proxy({}, { get: function (c, nom) {
        if (nom === 'withSuccessHandler') return function (f) { ok = f; return p; };
        if (nom === 'withFailureHandler') return function (f) { ko = f; return p; };
        if (nom === 'withUserObject') return function (o) { objet = o; return p; };
        return function () {
          var a = Array.prototype.slice.call(arguments), q;
          if (nom === 'appelProtege') q = appel(a[1], a[0], a[2] || []);
          else if (nom === 'etatAcces' || nom === 'deconnecterAppareil') q = appel(nom, a[0], []);
          else q = appel(nom, '', a);
          q.then(function (r) { if (ok) ok(r, objet); }, function (e) {
            var er = e instanceof Error ? e : new Error(String(e));
            if (/Failed to fetch|NetworkError|Load failed/i.test(er.message)) er = new Error('Pas de connexion au serveur : vérifiez le réseau, puis réessayez.');
            if (ko) ko(er, objet); else console.error(er);
          });
        };
      } });
      return p;
    }
    document.addEventListener('DOMContentLoaded', function () { if (!document.title) document.title = 'Diffusion'; });
    window.google = window.google || {};
    google.script = {
      run: new Proxy({}, { get: function (c, nom) { return lanceur()[nom]; } }),
      history: { push: function () {}, replace: function () {}, setChangeHandler: function () {} },
      url: { getLocation: function (f) { setTimeout(function () { f({ parameter: {}, parameters: {}, hash: '' }); }, 0); } },
      host: { close: function () {}, setHeight: function () {}, setWidth: function () {}, editor: { focus: function () {} } }
    };
    // Liens et fenêtres vers l'extérieur : navigateur du système (l'appli ne quitte jamais son écran).
    function ouvrirDehors(u) {
      try { var T = window.__TAURI__; if (T && T.opener && T.opener.openUrl) { T.opener.openUrl(String(u)); return true; } } catch (e) { /* plus bas */ }
      return false;
    }
    var ouvrirAvant = window.open;
    window.open = function (u) {
      if (u && /^(https?:|mailto:|tel:)/i.test(String(u)) && ouvrirDehors(u)) return null;
      return ouvrirAvant ? ouvrirAvant.apply(window, arguments) : null;
    };
    document.addEventListener('click', function (e) {
      var a = e.target && e.target.closest && e.target.closest('a[href]'); if (!a || e.defaultPrevented) return;
      var h = a.getAttribute('href') || '';
      if (/^(https?:|mailto:|tel:)/i.test(h) && (a.target === '_blank' || a.target === '_top' || !/^#/.test(h)) && !a.hasAttribute('download')) {
        if (ouvrirDehors(a.href)) e.preventDefault();
      }
    }, false);
    // Nouvelle version de l'écran : préparée pour la prochaine ouverture (rien ne change sous les yeux).
    setTimeout(function () {
      appel('page', '', []).then(function (r) {
        if (!r || !r.html) return;
        var o = indexedDB.open('diffusion-appli', 1);
        o.onupgradeneeded = function () { o.result.createObjectStore('ecran'); };
        o.onsuccess = function () { try { o.result.transaction('ecran', 'readwrite').objectStore('ecran').put({ html: r.html, le: Date.now() }, 'page'); } catch (e) { /* la prochaine fois */ } };
      }, function () { /* réseau : la version gardée reste */ });
    }, 5000);
  }.toString() + ')(' + JSON.stringify(EXEC) + ');';

  function afficher(html) {
    var avec = String(html).replace(/<head([^>]*)>/i, function (m) { return m + '<script>' + SHIM + '<\/script>'; });
    document.open(); document.write(avec); document.close();
  }
  function etat(t, bouton) {
    var e = document.getElementById('etat'), b = document.getElementById('reessayer');
    if (e) e.textContent = t; if (b) b.classList.toggle('cache', !bouton);
  }
  function chercher() { return porte('page', '', []).then(function (r) { return r && r.html; }); }

  lire('page', function (garde) {
    if (garde && garde.html) {
      afficher(garde.html);
      return;
    }
    var essayer = function () {
      etat('Première ouverture : chargement de l\'écran…', false);
      chercher().then(function (h) {
        if (!h) throw new Error('Écran vide.');
        ecrire('page', { html: h, le: Date.now() });
        afficher(h);
      }, function (e) { etat((e && e.message ? e.message : String(e)) + ' Vérifiez la connexion.', true); });
    };
    document.getElementById('reessayer').onclick = essayer;
    essayer();
  });
})();
</script>
</body>
</html>
