<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boîte mail</title>
<style>
  :root { --fond: #f4f2ee; --carte: #fff; --carte2: #f7f5f1; --ligne: #e3ded5; --texte: #22201c; --doux: #6d675d; --accent: #1f6feb; --ok: #2f8a4c; --barre: 240px; --z: 1; }
  @media (prefers-color-scheme: dark) { :root { --fond: #16161a; --carte: #202027; --carte2: #2a2a33; --ligne: #383843; --texte: #eceaf2; --doux: #a19fae; --accent: #6ea8ff; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fond); color: var(--texte); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button { font: 600 14px/1.2 inherit; font-family: inherit; border-radius: 999px; padding: 9px 16px; border: 1px solid var(--ligne); background: var(--carte); color: var(--texte); cursor: pointer; }
  button.prim { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .6; cursor: default; }
  .appli { display: grid; grid-template-columns: calc(var(--barre) * var(--z)) minmax(0, 1fr); height: 100%; }
  /* Taille de l'affichage (rouage) : le volet et les pages par « zoom », les boîtes (cadres) par une mise à l'échelle, qui marche partout. */
  nav, .page { zoom: var(--z); }
  nav { border-right: 1px solid var(--ligne); padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; overflow: auto; background: var(--carte2); }
  nav h1 { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; margin: 4px 8px 12px; display: flex; align-items: center; gap: 6px; }
  nav h1 span { flex: 1; min-width: 0; }
  #plier { flex: none; border: 0; background: transparent; color: var(--doux); border-radius: 8px; width: 26px; height: 26px; display: grid; place-items: center; padding: 0; }
  #plier:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--texte); }
  #plier svg { width: 16px; height: 16px; }
  .dos > svg { display: none; }
  /* Volet rabattu (chevron en haut) : une colonne de pictogrammes, pour laisser toute la place à la boîte. */
  @media (min-width: 761px) {
    html.volet-plie { --barre: 54px; }
    html.volet-plie nav { padding: 10px 6px; overflow-x: hidden; }
    html.volet-plie nav h1 { margin: 0 0 8px; justify-content: center; }
    html.volet-plie nav h1 span, html.volet-plie nav .nom, html.volet-plie .plus-rub, html.volet-plie .dos.titre, html.volet-plie .dos.lib { display: none; }
    html.volet-plie .choix, html.volet-plie .rub, html.volet-plie .roue { justify-content: center; padding: 9px 0; }
    html.volet-plie .pastille { width: 14px; height: 14px; }
    html.volet-plie .dos { justify-content: center; padding: 6px 0; position: relative; }
    html.volet-plie .dos > svg { display: block; width: 16px; height: 16px; color: var(--doux); }
    html.volet-plie .dos.actif > svg { color: var(--accent); }
    html.volet-plie .dos .nb { position: absolute; top: 0; right: 3px; font-size: 9px; line-height: 1; background: var(--accent); color: #fff; border-radius: 999px; padding: 2px 4px; }
    html.volet-plie .rub svg { width: 17px; height: 17px; }
  }
  @media (max-width: 760px) { #plier { display: none; } }
  .choix { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 10px; padding: 9px 10px; font-weight: 500; }
  .choix:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .choix.actif { background: color-mix(in srgb, var(--accent) 15%, var(--carte)); font-weight: 650; }
  .choix .nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .choix .nb { font-size: 12px; color: var(--doux); }
  .pastille { flex: none; width: 12px; height: 12px; border-radius: 50%; }
  .toutes .pastille { background: conic-gradient(#1f6feb 0 33%, #e0b100 0 66%, #2f8a4c 0); }
  nav .plus { margin-top: 10px; color: var(--accent); }
  /* Dossiers de la boîte affichée, en petit sous les comptes ; libellés repliés ; rouage des réglages tout en bas. */
  .dossiers { display: flex; flex-direction: column; gap: 1px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--ligne); }
  .dos { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 4px 10px 4px 32px; font-size: 13px; font-weight: 450; color: var(--texte); }
  .dos:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .dos.actif { background: color-mix(in srgb, var(--accent) 15%, var(--carte)); font-weight: 650; }
  .dos .nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dos .nb { flex: none; font-size: 11px; color: var(--doux); font-weight: 600; }
  .dos.titre { color: var(--doux); font-size: 12px; margin-top: 4px; }
  .dos.titre .fleche { display: inline-block; width: 10px; transition: transform .15s; }
  .dos.titre.ouvert .fleche { transform: rotate(90deg); }
  .dos.lib { padding-left: 44px; }
  /* Campagnes, Modèles, Carnet d'adresses de la boîte affichée : à part, sous les dossiers, avec leurs raccourcis « nouveau ». */
  .rubriques { display: flex; flex-direction: column; gap: 1px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--ligne); }
  .rub { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 6px 10px; font-size: 14px; font-weight: 550; color: var(--texte); }
  .rub svg { width: 15px; height: 15px; flex: none; color: var(--doux); }
  .rub:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .rub.actif { background: color-mix(in srgb, var(--accent) 15%, var(--carte)); font-weight: 650; }
  .rub .nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dos.plus-rub { color: var(--accent); padding-left: 33px; }
  nav .bas { margin-top: auto; padding-top: 10px; position: relative; }
  .roue { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 10px; padding: 7px 10px; font-size: 13px; font-weight: 500; color: var(--doux); }
  .roue:hover, .roue.actif { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--texte); }
  .roue svg { width: 16px; height: 16px; flex: none; }
  .menu-roue { position: fixed; z-index: 20; min-width: 210px; max-width: calc(100vw - 16px); background: var(--carte); border: 1px solid var(--ligne); border-radius: 12px; box-shadow: 0 12px 34px rgba(0,0,0,.2); padding: 6px; display: none; }
  .menu-roue.visible { display: block; }
  .menu-roue button { display: block; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 8px 10px; font-weight: 500; }
  .menu-roue button:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .menu-roue .taille { display: flex; align-items: center; gap: 6px; padding: 8px 10px 6px; border-top: 1px solid var(--ligne); margin-top: 4px; font-size: 13px; }
  .menu-roue .taille span.nom { flex: 1; min-width: 0; }
  .menu-roue .taille button { display: inline-grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 1px solid var(--ligne); border-radius: 50%; font-size: 17px; font-weight: 600; text-align: center; }
  .menu-roue .taille b { min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
  main { position: relative; min-width: 0; height: 100%; overflow: hidden; }
  .cadre { position: absolute; left: 0; top: 0; width: calc(100% / var(--z)); height: calc(100% / var(--z)); transform: scale(var(--z)); transform-origin: 0 0; border: 0; background: var(--fond); display: none; }
  .cadre.visible { display: block; }
  .page { position: absolute; inset: 0; overflow: auto; padding: 18px 18px 60px; display: none; }
  .page.visible { display: block; }
  .page > .dans { max-width: 820px; margin: 0 auto; }
  .page h2 { font-size: 21px; margin: 4px 0 6px; }
  .sous { color: var(--doux); margin: 0 0 16px; }
  .liste { display: flex; flex-direction: column; gap: 6px; }
  .conv { display: grid; grid-template-columns: 4px 18px minmax(0, 1fr) auto; gap: 10px; background: var(--carte); border: 1px solid var(--ligne); border-radius: 12px; padding: 10px 12px 10px 0; cursor: pointer; overflow: hidden; }
  .conv:hover { box-shadow: 0 3px 10px rgba(0,0,0,.07); }
  .conv .bord { border-radius: 0 4px 4px 0; }
  .conv .haut { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
  .conv .qui { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv .cpt { font-size: 12px; color: var(--doux); white-space: nowrap; }
  .conv .objet { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #liste-toutes { zoom: var(--txt, 1); }
  .conv .extrait { color: var(--doux); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv .quand { font-size: 12px; color: var(--doux); white-space: nowrap; }
  .conv.non-lu { background: color-mix(in srgb, var(--accent) 7%, var(--carte)); }
  .conv.non-lu .qui, .conv.non-lu .objet { font-weight: 700; }
  .conv.ouverte { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .cherche-toutes { display: flex; gap: 8px; margin: 0 0 8px; }
  .cherche-toutes input { flex: 1; min-width: 0; }
  .cherche-toutes button { flex: none; border: 1px solid var(--ligne); background: var(--carte); border-radius: 10px; padding: 0 12px; font-weight: 550; }
  #fermer-lecteur { display: none; }
  .conv .coche { align-self: center; width: 16px; height: 16px; margin: 0; }
  .conv.cochee { background: color-mix(in srgb, var(--accent) 12%, var(--carte)); }
  /* Actions sur les mails cochés (toutes boîtes confondues) : la barre n'apparaît que s'il y a des coches. */
  #actions-toutes { display: none; position: sticky; top: -18px; z-index: 3; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--carte); border: 1px solid var(--accent); border-radius: 12px; padding: 8px 10px; margin: 0 0 8px; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
  #actions-toutes.visible { display: flex; }
  #actions-toutes b { margin-right: 4px; white-space: nowrap; }
  #actions-toutes button { border: 1px solid var(--ligne); background: var(--carte2); border-radius: 9px; padding: 5px 10px; font-size: 13px; font-weight: 550; }
  #actions-toutes button:hover { border-color: var(--accent); }
  #actions-toutes button:disabled { opacity: .5; }
  /* Toutes les boîtes, écran large : la liste reste à gauche, le mail choisi s'affiche à droite dans la boîte de son compte. */
  @media (min-width: 1000px) {
    #page-toutes.avec-lecteur { right: auto; width: 430px; border-right: 1px solid var(--ligne); padding: 14px 12px 60px; }
    #page-toutes.avec-lecteur #fermer-lecteur { display: block; }
    .cadre.lecteur { left: 430px; width: calc((100% - 430px) / var(--z)); }
  }
  .etat { color: var(--doux); font-size: 13px; margin: 6px 0 12px; }
  .boite { background: var(--carte); border: 1px solid var(--ligne); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .etape { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--ligne); }
  .etape:first-of-type { border-top: 0; }
  .num { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .etape p { margin: 2px 0 8px; }
  .doux { color: var(--doux); font-size: 13px; }
  input[type=text], textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--ligne); background: var(--carte2); color: var(--texte); font: inherit; }
  textarea { min-height: 70px; font: 12px/1.3 ui-monospace, Menlo, monospace; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .compte { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--carte); border: 1px solid var(--ligne); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .couleurs { display: flex; gap: 6px; }
  .couleurs span { width: 22px; height: 22px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
  .couleurs span.choisie { border-color: var(--texte); }
  .message { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--texte); color: var(--fond); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); display: none; z-index: 9; }
  .barre-tel { display: none; }
  html.fenetre-ecrire nav { display: none !important; }
  html.fenetre-ecrire .appli { grid-template-columns: minmax(0, 1fr) !important; grid-template-rows: minmax(0, 1fr) !important; }
  @media (max-width: 760px) {
    .appli { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    nav { zoom: 1; }
    nav { flex-direction: row; border-right: 0; border-bottom: 1px solid var(--ligne); padding: 8px; overflow-x: auto; gap: 6px; }
    nav h1 { display: none; }
    .choix { width: auto; flex: none; border: 1px solid var(--ligne); border-radius: 999px; padding: 7px 12px; }
    .choix .nom { max-width: 140px; }
    nav .plus { margin-top: 0; }
    .dossiers, .rubriques { display: none; }
    nav .bas { margin-top: 0; margin-left: auto; padding-top: 0; flex: none; }
    .roue { width: auto; border: 1px solid var(--ligne); border-radius: 999px; padding: 7px 10px; }
    .roue .nom { display: none; }
    .page { padding: 12px 12px 60px; }
    .compte { grid-template-columns: auto minmax(0, 1fr); }
    .compte .actions { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<div class="appli">
  <nav id="nav" aria-label="Comptes"></nav>
  <main id="main">
    <section class="page" id="page-toutes"><div class="dans">
      <h2>Toutes les boîtes</h2>
      <form class="cherche-toutes" id="cherche-toutes"><input type="text" id="mots-toutes" placeholder="Chercher dans toutes les boîtes" aria-label="Chercher dans toutes les boîtes"><button type="button" id="fermer-lecteur" title="Fermer le mail affiché à droite">Fermer le mail</button></form>
      <p class="etat" id="etat-toutes"></p>
      <div id="actions-toutes" aria-label="Actions sur les mails cochés"></div>
      <div class="liste" id="liste-toutes"></div>
    </div></section>
    <section class="page" id="page-ajouter"><div class="dans" id="ajouter"></div></section>
    <section class="page" id="page-comptes"><div class="dans" id="comptes"></div></section>
  </main>
</div>
<div class="menu-roue" id="menu-roue" role="menu"></div>
<div class="message" id="message" role="status"></div>
<script>
/*
 * Appli Boîte mail : coquille locale, plusieurs comptes Google.
 * Chaque compte relié = une Boîte mail à elle (un « moteur » Apps Script dans le Drive de la personne), affichée dans un cadre
 * avec son jeton d'appareil. « Toutes les boîtes » lit la boîte principale de chaque compte par sa porte (doPost).
 * Ajouter un compte : copie guidée du modèle, puis « Relier à l'appli » dans la copie → lien boitemail://relier?c=… ou code collé.
 * Rien de personnel dans la coquille : adresses et jetons sont gardés sur l'appareil seulement.
 */
(function () {
  var MODELE = 'https://docs.google.com/spreadsheets/d/1ASK-DE6JQPvcn471bWiASXp88oaGneUlPWYHOUwGDsc/copy'; // Boîte mail vierge à copier (rempli à la publication)
  var CLE = 'boite-mail-comptes', CLE_VUE = 'boite-mail-vue';
  var COULEURS = ['#1f6feb', '#e0b100', '#2f8a4c', '#c2410c', '#8b5cf6', '#db2777', '#0e7490', '#6b7280'];
  var T = window.__TAURI__ || null;
  var comptes = lireComptes(), vue = lireVue(), cadres = {}, sources = {}, minuterie = null;
  /* Fenêtre séparée pour écrire un mail : la même page, ouverte avec ?ecrire=<étiquette>, ne montre que la boîte du compte
     et lui demande d'ouvrir le mail (confié par la fenêtre principale dans la mémoire de l'appli). */
  var FEN = (location.search.match(/[?&]ecrire=([\w-]{1,40})/) || [])[1] || '', fenDonnees = null, fenDit = false;
  if (FEN) {
    try { fenDonnees = JSON.parse(localStorage.getItem('boite-mail-fenetre-' + FEN) || 'null'); localStorage.removeItem('boite-mail-fenetre-' + FEN); } catch (e) { fenDonnees = null; }
    document.documentElement.classList.add('fenetre-ecrire');
  }
  function fenetresPossibles() { return T ? !!(T.webviewWindow && T.webviewWindow.WebviewWindow) : true; }
  /* Fenêtre d'avance : pour que « Fenêtre séparée » s'ouvre tout de suite, une fenêtre d'écriture de la boîte affichée est
     chargée à l'avance, cachée. Elle se montre quand on la demande (et une autre se prépare) ; sinon, chargement ordinaire. */
  var reserve = null, reserveT = null;
  function finReserve() { if (reserve) { try { T.event.emitTo(reserve.label, 'ecrire-fin', {}); } catch (e) { /* déjà fermée */ } reserve = null; } }
  function preparerReserve(id, delai) {
    if (!T || FEN || !fenetresPossibles() || !T.event || !T.event.emitTo) return;
    clearTimeout(reserveT);
    reserveT = setTimeout(function () {
      var c = comptes.filter(function (x) { return x.id === id; })[0];
      if (!c || vue !== id || (reserve && reserve.compte === id)) return;
      finReserve();
      var label = 'ecrire-r' + Date.now().toString(36);
      try {
        localStorage.setItem('boite-mail-fenetre-' + label, JSON.stringify({ compte: id, reserve: true }));
        var w = new T.webviewWindow.WebviewWindow(label, { url: 'index.html?ecrire=' + label, title: 'Écrire · ' + nomCourt(c), width: 760, height: 800, minWidth: 420, minHeight: 480, dragDropEnabled: false, visible: false, focus: false });
        reserve = { label: label, compte: id, pret: false };
        w.once('tauri://error', function () { if (reserve && reserve.label === label) reserve = null; try { localStorage.removeItem('boite-mail-fenetre-' + label); } catch (x) { /* rien */ } });
      } catch (e) { reserve = null; }
    }, delai);
  }
  if (T && !FEN) try {
    T.event.listen('reserve-prete', function (ev) { var l = ev && ev.payload && ev.payload.label; if (reserve && reserve.label === l) reserve.pret = true; });
    window.addEventListener('pagehide', finReserve);
    if (T.window && T.window.getCurrentWindow) T.window.getCurrentWindow().onCloseRequested(function () { finReserve(); });
  } catch (e) { /* sans fenêtre d'avance */ }
  function ouvrirFenetreEcrire(id, onglet) {
    var c = comptes.filter(function (x) { return x.id === id; })[0]; if (!c) return;
    if (T && reserve && reserve.compte === id && reserve.pret) {
      var r = reserve; reserve = null;
      try { T.event.emitTo(r.label, 'ecrire-mail', { onglet: onglet || null }); preparerReserve(id, 8000); return; } catch (e) { /* chargement ordinaire */ }
    }
    preparerReserve(id, 15000);
    var label = 'ecrire-' + Date.now().toString(36);
    try { localStorage.setItem('boite-mail-fenetre-' + label, JSON.stringify({ compte: id, onglet: onglet || null })); } catch (e) { return dire('Mémoire de l\'appli pleine : la fenêtre ne peut pas s\'ouvrir.'); }
    var titre = 'Écrire · ' + nomCourt(c);
    try {
      if (T) {
        var w = new T.webviewWindow.WebviewWindow(label, { url: 'index.html?ecrire=' + label, title: titre, width: 760, height: 800, minWidth: 420, minHeight: 480, dragDropEnabled: false });
        w.once('tauri://error', function (e) { dire('La fenêtre n\'a pas pu s\'ouvrir : le mail reste dans les onglets du bas.'); try { localStorage.removeItem('boite-mail-fenetre-' + label); } catch (x) { /* rien */ } });
      } else if (!window.open('index.html?ecrire=' + label, label, 'width=760,height=800')) dire('Le navigateur a bloqué la nouvelle fenêtre.');
    } catch (e) { dire('La fenêtre n\'a pas pu s\'ouvrir : le mail reste dans les onglets du bas.'); }
  }
  var fenSource = null, fenAttente = null;
  function fenEnvoyer(onglet) {
    if (!fenSource) { fenAttente = { onglet: onglet }; return; }
    try { fenSource.postMessage({ boiteMail: 'ecrireOnglet', onglet: onglet || null }, '*'); } catch (x) { /* fermé */ }
  }
  if (FEN && T && fenDonnees && fenDonnees.reserve) try {
    T.event.listen('ecrire-mail', function (ev) {
      fenEnvoyer(ev && ev.payload && ev.payload.onglet);
      try { var w = T.window.getCurrentWindow(); w.show(); w.setFocus(); } catch (e) { /* déjà visible */ }
    });
    T.event.listen('ecrire-fin', function () { fermerCetteFenetre(); });
    // Si la fenêtre principale a disparu, celle-ci (encore cachée) ne doit pas rester seule.
    setInterval(function () { try { T.webviewWindow.WebviewWindow.getByLabel('main').then(function (m) { if (!m) fermerCetteFenetre(); }); } catch (e) { /* rien */ } }, 30000);
  } catch (e) { /* sans événements */ }
  function fermerCetteFenetre() {
    try { if (T && T.window && T.window.getCurrentWindow) { T.window.getCurrentWindow().close(); return; } } catch (e) { /* plus bas */ }
    try { window.close(); } catch (e) { /* rien */ }

  function ouvrirFilDans(id, filId) {
    montrer(id);
    var essais = 0;
    (function envoyer() {
      var s = sources[id];
      if (s) { s.postMessage({ boiteMail: 'ouvrirFil', id: filId }, '*'); return; }
      if (++essais < 60) setTimeout(envoyer, 250); else dire('La boîte s\'ouvre : cherchez le mail dans la liste.');
    })();
  }

  /* ---------- Toutes les boîtes ---------- */
  var tout = {};
  function chargerToutes() {
    $('etat-toutes').textContent = 'Mise à jour…';
    var dos = choix.libelle ? 'reception' : (choix.dossier || 'reception'), nomDos = (DOSSIERS.filter(function (x) { return x[0] === dos; })[0] || DOSSIERS[0])[1];
    var mots = ($('mots-toutes').value || '').trim();
    var req = { dossier: dos === 'reception' ? 'principale' : dos, libelle: '', recherche: mots, debut: 0, jeton: '', contactsSeuls: false, sansRemises: true };
    var titre = document.querySelector('#page-toutes h2'); if (titre) titre.textContent = 'Toutes les boîtes · ' + nomDos + (mots ? ' · « ' + mots + ' »' : '');
    var fini = 0, erreurs = [];
    comptes.forEach(function (c) {
      porte(c, 'listeFils', [req]).then(function (r) { tout[c.id] = (r && r.fils) || []; }, function (e) { erreurs.push(nomCourt(c) + ' : ' + (e && e.message || e)); })
        .then(function () { fini++; dessinerToutes(); if (fini === comptes.length) $('etat-toutes').textContent = erreurs.length ? 'Pas à jour : ' + erreurs.join(' · ') : nomDos + ' de ' + comptes.length + ' comptes, du plus récent au plus ancien.'; });
    });
  }
  function quand(d) {
    var t = Date.parse(String(d || '')); if (isNaN(t)) return '';
    var x = new Date(t), auj = new Date();
    if (x.toDateString() === auj.toDateString()) return ('0' + x.getHours()).slice(-2) + ':' + ('0' + x.getMinutes()).slice(-2);
    return x.getDate() + '.' + (x.getMonth() + 1) + (x.getFullYear() !== auj.getFullYear() ? '.' + x.getFullYear() : '');
  }
  function dessinerToutes() {
    var lignes = [];
    comptes.forEach(function (c) { (tout[c.id] || []).forEach(function (f) { lignes.push({ c: c, f: f, t: Date.parse(String(f.date || '')) || 0 }); }); });
    lignes.sort(function (a, b) { return b.t - a.t; });
    var la = {}; lignes.forEach(function (l) { la[l.c.id + '|' + l.f.id] = 1; });
    Object.keys(cochesToutes).forEach(function (k) { if (!la[k]) delete cochesToutes[k]; });
    dessinerActionsToutes();
    $('liste-toutes').innerHTML = lignes.slice(0, 150).map(function (l) {
      var f = l.f, qui = (f.contacts || []).map(function (x) { return x.nom || x.cle; }).join(', ') || f.de || '—';
      return '<div class="conv' + (f.nonLu ? ' non-lu' : '') + (lecteur && lecteur.id === l.c.id && lecteur.fil === f.id ? ' ouverte' : '') + (cochesToutes[l.c.id + '|' + f.id] ? ' cochee' : '') + '" data-compte="' + esc(l.c.id) + '" data-fil="' + esc(f.id) + '" role="button" tabindex="0">' +
        '<span class="bord" style="background:' + esc(l.c.couleur) + '"></span>' +
        '<input type="checkbox" class="coche" aria-label="Cocher ce mail"' + (cochesToutes[l.c.id + '|' + f.id] ? ' checked' : '') + '>' +
        '<div style="min-width:0"><div class="haut"><span class="qui">' + esc(qui) + '</span><span class="cpt">' + esc(nomCourt(l.c)) + '</span></div>' +
        '<div class="objet">' + esc(f.objet) + (f.nb > 1 ? ' <span class="doux">(' + f.nb + ')</span>' : '') + '</div>' +
        '<div class="extrait">' + esc(f.extrait) + '</div></div>' +
        '<span class="quand">' + esc(quand(f.date)) + '</span></div>';
    }).join('') || '<p class="doux">Rien pour l\'instant.</p>';
  }
  /* Mails cochés dans « Toutes les boîtes » : la même action part vers chaque compte concerné. */
  var cochesToutes = {}, actionEnCours = false;
  var ACTIONS_TOUTES = [['archiver', 'Archiver'], ['corbeille', 'Supprimer'], ['lu', 'Lu'], ['nonLu', 'Non lu'], ['suivre', 'Suivre'], ['nePlusSuivre', 'Ne plus suivre']];
  function dessinerActionsToutes() {
    var n = Object.keys(cochesToutes).length, z = $('actions-toutes');
    z.classList.toggle('visible', n > 0);
    z.innerHTML = n ? '<b>' + n + (n > 1 ? ' cochés' : ' coché') + '</b>' + ACTIONS_TOUTES.map(function (a) { return '<button type="button" data-action="' + a[0] + '"' + (actionEnCours ? ' disabled' : '') + '>' + a[1] + '</button>'; }).join('') + '<button type="button" data-action=""' + (actionEnCours ? ' disabled' : '') + '>Tout décocher</button>' : '';
  }
  function agirToutes(action) {
    if (!action) { cochesToutes = {}; return dessinerToutes(); }
    if (actionEnCours) return;
    var par = {}; Object.keys(cochesToutes).forEach(function (k) { var i = k.indexOf('|'); (par[k.slice(0, i)] = par[k.slice(0, i)] || []).push(k.slice(i + 1)); });
    var ids = Object.keys(par), fini = 0, rates = [], total = Object.keys(cochesToutes).length;
    if (!ids.length) return;
    actionEnCours = true; dessinerActionsToutes(); $('etat-toutes').textContent = 'Action en cours…';
    ids.forEach(function (id) {
      var c = comptes.filter(function (x) { return x.id === id; })[0];
      (c ? porte(c, 'actionFils', [par[id], action, '']) : Promise.reject(new Error('compte retiré')))
        .then(function () { par[id].forEach(function (f) { delete cochesToutes[id + '|' + f]; }); }, function (e) { rates.push((c ? nomCourt(c) : id) + ' : ' + (e && e.message || e)); })
        .then(function () {
          if (++fini < ids.length) return;
          actionEnCours = false;
          dire(rates.length ? 'Pas fait pour ' + rates.join(' · ') : (total > 1 ? total + ' mails : ' : 'Mail : ') + (ACTIONS_TOUTES.filter(function (a) { return a[0] === action; })[0] || ['', action])[1].toLowerCase() + ', fait.');
          chargerToutes();
        });
    });
  }
  $('actions-toutes').addEventListener('click', function (e) { var b = e.target.closest('[data-action]'); if (b && !b.disabled) agirToutes(b.getAttribute('data-action')); });
  /* Lire un mail sans quitter « Toutes les boîtes » : sur écran large, la boîte du compte s'affiche à droite, réduite au mail. */
  var lecteur = null, LARGE = window.matchMedia ? window.matchMedia('(min-width: 1000px)') : { matches: true };
  function fermerLecteur(silence) {
    if (!lecteur) return;
    var id = lecteur.id; lecteur = null;
    if (cadres[id]) cadres[id].classList.remove('lecteur', 'visible');
    direBoite(id, { boiteMail: 'lecteur', actif: false });
    $('page-toutes').classList.remove('avec-lecteur');
    if (!silence) dessinerToutes();
  }
  function lireIci(id, filId) {
    if (!LARGE.matches) return ouvrirFilDans(id, filId);
    if (lecteur && lecteur.id === id && lecteur.fil === filId) return fermerLecteur();
    if (lecteur && lecteur.id !== id) fermerLecteur(true);
    lecteur = { id: id, fil: filId };
    $('page-toutes').classList.add('avec-lecteur');
    cadre(id).classList.add('lecteur', 'visible');
    dessinerToutes();
    var essais = 0;
    (function envoyer() {
      if (!lecteur || lecteur.id !== id || lecteur.fil !== filId) return;
      if (direBoite(id, { boiteMail: 'lecteur', actif: true, id: filId })) return;
      if (++essais < 80) setTimeout(envoyer, 250); else dire('La boîte tarde à s\'ouvrir : réessayez dans un instant.');
    })();
  }
  if (LARGE.addEventListener) LARGE.addEventListener('change', function () { if (!LARGE.matches) fermerLecteur(); });
  $('fermer-lecteur').addEventListener('click', function () { fermerLecteur(); });
  $('cherche-toutes').addEventListener('submit', function (e) { e.preventDefault(); tout = {}; dessinerToutes(); chargerToutes(); });
  $('mots-toutes').addEventListener('search', function () { if (!this.value) { tout = {}; chargerToutes(); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && lecteur && vue === 'toutes') fermerLecteur(); });
  $('liste-toutes').addEventListener('click', function (e) {
    if (e.target.classList.contains('coche')) { var cv = e.target.closest('.conv'), k = cv.getAttribute('data-compte') + '|' + cv.getAttribute('data-fil'); if (e.target.checked) cochesToutes[k] = 1; else delete cochesToutes[k]; cv.classList.toggle('cochee', e.target.checked); return dessinerActionsToutes(); }
    var d = e.target.closest('.conv'); if (d) lireIci(d.getAttribute('data-compte'), d.getAttribute('data-fil')); });
  $('liste-toutes').addEventListener('keydown', function (e) { if (e.key === 'Enter') { var d = e.target.closest('.conv'); if (d) lireIci(d.getAttribute('data-compte'), d.getAttribute('data-fil')); } });

  /* ---------- Ajouter un compte ---------- */
  function dessinerAjouter() {
    var pret = !/__MODELE__/.test(MODELE);
    $('ajouter').innerHTML =
      '<h2>Ajouter un compte</h2><p class="sous">Chaque compte Google a sa propre Boîte mail, dans son Drive. Ça prend une minute, dans votre navigateur, avec le compte à relier.</p>' +
      '<div class="boite">' +
      '<div class="etape"><span class="num">1</span><div><b>Créer la Boîte mail du compte</b><p class="doux">Une copie vierge s\'ouvre dans le navigateur. Indiquez l\'adresse Gmail du compte : la copie se fait avec ce compte-là. Puis « Créer une copie ».</p>' +
        '<input type="text" id="aj-email" inputmode="email" autocomplete="email" placeholder="Adresse Gmail du compte à relier" style="margin-bottom:8px">' +
        '<button type="button" class="prim" id="aj-copie"' + (pret ? '' : ' disabled') + '>Créer ma Boîte mail</button>' + (pret ? '' : ' <span class="doux">(bientôt)</span>') + '</div></div>' +
      '<div class="etape"><span class="num">2</span><div><b>Relier à l\'appli</b><p class="doux">Dans la copie : menu <b>Boîte mail › Relier à l\'appli Boîte mail</b>, puis acceptez les autorisations Google (« appli non validée » : c\'est normal pour un outil à soi, « Paramètres avancés › Accéder »). La première fois, un interrupteur Google est demandé : la fenêtre explique.</p></div></div>' +
      '<div class="etape"><span class="num">3</span><div><b>Ouvrir dans l\'appli</b><p class="doux">Cliquez « Ouvrir dans l\'appli Boîte mail » : le compte apparaît ici tout seul. Sinon, collez le code :</p>' +
        '<textarea id="aj-code" placeholder="Code de liaison"></textarea><div class="actions"><button type="button" id="aj-ok">Relier avec ce code</button></div></div></div>' +
      '</div>';
    var b = $('aj-copie'); if (b && pret) b.onclick = function () {
      // Plusieurs comptes Google dans le navigateur : sans « authuser », la copie part sur le compte par défaut.
      var em = String($('aj-email').value || '').trim();
      if (em && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { dire('Adresse incomplète.'); return; }
      ouvrirDehors(MODELE + (em ? '?authuser=' + encodeURIComponent(em) : ''));
    };
    $('aj-ok').onclick = function () { relier($('aj-code').value); };
  }
  function decoder(code) {
    var s = String(code || '').trim().replace(/^.*[?&]c=/, '').replace(/&.*$/, '');
    s = decodeURIComponent(s).replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
    var o = JSON.parse(decodeURIComponent(escape(atob(s))));
    if (!o || !/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(o.u) || !/^[a-f0-9]{96}$/.test(o.j)) throw new Error('Code incomplet.');
    return o;
  }
  function relier(code) {
    var o;
    try { o = decoder(code); } catch (e) { dire('Ce code n\'est pas reconnu. Recopiez-le en entier.'); return; }
    var c = { id: 'c' + Date.now().toString(36), email: o.e || '', nom: '', url: o.u, jeton: o.j, couleur: COULEURS[comptes.length % COULEURS.length], ajoute: new Date().toISOString() };
    dire('Vérification du compte…');
    porte(c, 'etatAcces', []).then(function (r) {
      if (!r || !r.valide) throw new Error('le code n\'est plus valable, refaites « Relier à l\'appli »');
      /* même adresse de moteur, ou même compte Google relié à une nouvelle copie : on remplace, pas de doublon */
      var deja = comptes.filter(function (x) { return x.url === c.url; })[0] ||
        (c.email ? comptes.filter(function (x) { return x.email && x.email.toLowerCase() === c.email.toLowerCase(); })[0] : null);
      if (deja) {
        deja.url = c.url; deja.jeton = c.jeton; if (c.email) deja.email = c.email;
        if (cadres[deja.id]) { cadres[deja.id].remove(); delete cadres[deja.id]; delete sources[deja.id]; }
        c = deja;
      }
      else comptes.push(c);
      garderComptes(); dire('Compte relié : ' + (c.email || nomCourt(c))); montrer(c.id);
    }, function (e) { dire('Pas pu relier : ' + (e && e.message || e)); });
  }

  /* ---------- Comptes reliés ---------- */
  function dessinerComptes() {
    $('comptes').innerHTML = '<h2>Comptes reliés</h2><p class="sous">Les boîtes que cette appli affiche. Retirer un compte ici ne touche pas à ses mails.</p>' +
      comptes.map(function (c) {
        return '<div class="compte" data-id="' + esc(c.id) + '"><span class="pastille" style="background:' + esc(c.couleur) + '"></span>' +
          '<div style="min-width:0"><input type="text" class="cp-nom" value="' + esc(c.nom) + '" placeholder="' + esc(nomCourt(c)) + '" aria-label="Nom affiché">' +
          '<div class="doux" style="margin-top:4px;overflow-wrap:anywhere">' + esc(c.email || 'adresse inconnue') + '</div>' +
          '<div class="couleurs" style="margin-top:6px">' + COULEURS.map(function (k) { return '<span data-couleur="' + k + '" style="background:' + k + '"' + (k === c.couleur ? ' class="choisie"' : '') + '></span>'; }).join('') + '</div></div>' +
          '<div class="actions"><button type="button" class="cp-retirer">Retirer</button></div></div>';
      }).join('');
  }
  $('comptes').addEventListener('change', function (e) {
    var l = e.target.closest('.compte'); if (!l || !e.target.classList.contains('cp-nom')) return;
    var c = comptes.filter(function (x) { return x.id === l.getAttribute('data-id'); })[0]; if (!c) return;
    c.nom = e.target.value.trim(); garderComptes(); dessinerNav();
  });
  $('comptes').addEventListener('click', function (e) {
    var l = e.target.closest('.compte'); if (!l) return;
    var id = l.getAttribute('data-id'), c = comptes.filter(function (x) { return x.id === id; })[0]; if (!c) return;
    var k = e.target.getAttribute('data-couleur');
    if (k) { c.couleur = k; garderComptes(); dessinerComptes(); dessinerNav(); }
    if (e.target.classList.contains('cp-retirer') && !e.target.hasAttribute('data-sur')) {
      /* pas de confirm() : la fenêtre de l'appli Mac ne l'affiche pas. Deux clics à la place. */
      var bt = e.target; bt.setAttribute('data-sur', '1'); bt.textContent = 'Retirer vraiment ?';
      setTimeout(function () { if (bt.isConnected) { bt.removeAttribute('data-sur'); bt.textContent = 'Retirer'; } }, 5000);
      return;
    }
    if (e.target.classList.contains('cp-retirer')) {
      comptes = comptes.filter(function (x) { return x.id !== id; });
      if (cadres[id]) { cadres[id].remove(); delete cadres[id]; delete sources[id]; }
      garderComptes(); dessinerComptes(); dessinerNav();
      try { porte(c, 'deconnecterAppareil', []); } catch (er) { /* hors ligne : le jeton expirera */ }
    }
  });

  /* ---------- Liens boitemail://relier?c=… ---------- */
  function liens(urls) { (urls || []).forEach(function (u) { if (/^boitemail:\/\/relier/i.test(String(u))) relier(String(u)); }); }
  if (!FEN) try {
    if (T && T.core) T.core.invoke('plugin:deep-link|get_current').then(liens, function () { /* aucun */ });
    if (T && T.event) T.event.listen('deep-link://new-url', function (ev) { liens(ev.payload); });
  } catch (e) { /* pas dans l'appli */ }
  // Essai dans un navigateur : #relier=<code>
  if (!FEN && /^#relier=/.test(location.hash)) { relier(location.hash.slice(8)); history.replaceState(null, '', location.pathname); }

  if (FEN) { if (fenDonnees && comptes.some(function (c) { return c.id === fenDonnees.compte; })) montrer(fenDonnees.compte); else fermerCetteFenetre(); }
  else montrer(vue || (comptes.length > 1 ? 'toutes' : (comptes[0] ? comptes[0].id : 'ajouter')));
})();
</script>
</body>
</html>
